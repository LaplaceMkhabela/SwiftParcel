# Netlify configuration for the SwiftParcel demo site (demo branch).
# The site is a single static index.html at the repository root, so there is
# no build step — Netlify just publishes the root directory.

[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
